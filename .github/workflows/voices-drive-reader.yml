name: Voices of Dawn Drive Reader
on:
  pull_request:
    paths: ['living-book-engine/**', '.github/workflows/voices-drive-reader.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mocked-drive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test reader and Drive cache
        run: node --test living-book-engine/tests/engine.test.mjs living-book-engine/tests/drive-assets.test.mjs living-book-engine/tests/voices-prologue.test.mjs
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test browser with mocked Drive responses
        env:
          LIVING_BOOK_URL: http://127.0.0.1:4318/
        run: |
          python3 -m http.server 4318 --bind 127.0.0.1 --directory living-book-engine >/tmp/voices-http.log 2>&1 &
          node living-book-engine/tests/voices-browser.test.mjs
