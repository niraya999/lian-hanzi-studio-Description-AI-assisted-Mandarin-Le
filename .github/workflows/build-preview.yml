name: LHS Build Preview
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate source assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text()
          js = Path('word-of-the-day.js').read_text()
          sw = Path('sw.js').read_text()
          assert 'id="buildCommit"' in html
          assert 'id="learn"' in html
          assert 'lhsCaptureLyrics?.(id,name,lyrics,url)' in html
          assert 'word-of-the-day.js' in html and 'word-of-the-day.js' in sw
          assert "timeZone:'Asia/Jakarta'" in js
          print('Static source checks passed')
          PY
      - name: Validate BCS integration and JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import subprocess
          import tempfile
          html = Path('index.html').read_text()
          sw = Path('sw.js').read_text()
          bcs = Path('bcs/bcs-native.js').read_text()
          assert 'id="bcsRoot"' in html
          assert 'data-tab="bcs"' in html
          assert 'bcs/bcs-native.js?v=2' in html
          assert 'bcs/bcs-native.js?v=1' in sw or 'bcs/bcs-native.js?v=2' in sw
          assert 'javascript:' not in bcs or 'safeUrl' in bcs
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.active = False
                  self.scripts = []
              def handle_starttag(self, tag, attrs):
                  if tag == 'script':
                      self.active = not dict(attrs).get('src')
                      if self.active: self.scripts.append('')
              def handle_data(self, data):
                  if self.active: self.scripts[-1] += data
              def handle_endtag(self, tag):
                  if tag == 'script': self.active = False
          parser = Scripts()
          parser.feed(html)
          with tempfile.TemporaryDirectory() as tmp:
              for i, script in enumerate(parser.scripts):
                  if not script.strip(): continue
                  file = Path(tmp) / f'inline-{i}.js'
                  file.write_text(script)
                  subprocess.run(['node','--check',str(file)],check=True)
          for path in ('bcs/bcs-native.js','bcs/deity-gallery.js','sw.js','word-of-the-day.js','verified-words.js','audio-recording-ui.js','audio-capture.worklet.js','mp3-encoder.worker.js'):
              subprocess.run(['node','--check',path],check=True)
          subprocess.run(['node','--check','audio-recording-engine.mjs'],check=True)
          assert 'id="enableAudioRecording"' in html
          assert 'lhs-shell-v126' in sw
          print('BCS integration and JavaScript syntax checks passed')
          PY
      - name: Run recording engine tests
        run: |
          node --test tests/audio-recording-engine.test.mjs
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Browser smoke test (mobile viewport)
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lhs-http.log 2>&1 &
          node scripts/bcs-browser-smoke.cjs
          node scripts/recording-browser-smoke.cjs
      - name: Upload mobile browser screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lhs-bcs-mobile-smoke-${{ github.sha }}
          path: |
            /tmp/lhs-bcs-mobile.png
            /tmp/lhs-bcs-desktop.png
          if-no-files-found: warn
      - name: Stage build artifact and embed source commit
        run: |
          export SOURCE_SHA="$(git rev-parse HEAD)"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          mkdir -p dist
          cp index.html word-of-the-day.js verified-words.js sw.js manifest.webmanifest icon.svg landscape.svg audio-recording-ui.js audio-recording-engine.mjs audio-capture.worklet.js mp3-encoder.worker.js dist/
          mkdir -p dist/vendor/audio
          cp vendor/audio/lamejs.iife.js vendor/audio/LGPL-3.0.txt dist/vendor/audio/
          mkdir -p dist/bcs
          cp bcs/bcs-native.js bcs/deity-gallery.js dist/bcs/
          python3 scripts/stamp-build.py --html dist/index.html --commit "$SOURCE_SHA" --date "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 - <<'PY'
          import os
          from pathlib import Path
          html = Path('dist/index.html').read_text()
          assert f'name="lhs-commit" content="{os.environ["SOURCE_SHA"]}"' in html
          assert 'name="lhs-build-date" content="20' in html
          assert 'id="enableAudioRecording"' in html
          assert Path('dist/audio-recording-engine.mjs').is_file()
          assert Path('dist/vendor/audio/lamejs.iife.js').is_file()
          print('Build metadata verified')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lhs-preview-${{ github.sha }}
          path: dist/
          if-no-files-found: error
