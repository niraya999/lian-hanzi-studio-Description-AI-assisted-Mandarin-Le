name: Deploy Lian Hanzi Studio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          mkdir -p dist/bcs
          cp bcs/bcs-native.js bcs/deity-gallery.js dist/bcs/
          cp index.html word-of-the-day.js verified-words.js sw.js manifest.webmanifest icon.svg landscape.svg CNAME dist/
          python3 scripts/stamp-build.py --html dist/index.html --commit "$(git rev-parse HEAD)" --date "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          grep -q 'Lian Hanzi Studio' dist/index.html
          grep -q 'bcs/bcs-native.js?v=2' dist/index.html
          grep -q 'data-tab="bcs"' dist/index.html
          test -s dist/bcs/bcs-native.js
          test -s dist/bcs/deity-gallery.js
          grep -q 'bcs/deity-gallery.js?v=1' dist/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
