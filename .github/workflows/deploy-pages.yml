name: Validate Lian Hanzi Studio Site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p dist/bcs
          cp bcs/bcs-native.js bcs/deity-gallery.js dist/bcs/
          cp index.html word-of-the-day.js verified-words.js home-card-images.js home-menu-config.json sw.js manifest.webmanifest icon.svg landscape.svg CNAME dist/
          python3 scripts/stamp-build.py --html dist/index.html --commit "$(git rev-parse HEAD)" --date "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          grep -q 'Lian Hanzi Studio' dist/index.html
          grep -q 'bcs/bcs-native.js?v=2' dist/index.html
          grep -q 'data-tab="bcs"' dist/index.html
          grep -q 'bcs/deity-gallery.js?v=2' dist/index.html
          grep -q 'home-card-images.js?v=5' dist/index.html
          test -s dist/bcs/bcs-native.js
          test -s dist/bcs/deity-gallery.js
          test -s dist/home-card-images.js
          test -s dist/home-menu-config.json
      - uses: actions/upload-artifact@v4
        with:
          name: lhs-site-validation
          path: dist
