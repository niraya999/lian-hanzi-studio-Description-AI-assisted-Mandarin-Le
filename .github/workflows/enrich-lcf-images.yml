name: Enrich LCF article thumbnails
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/enrich_lcf_images.py'
      - 'lcf/articles.json'
permissions:
  contents: write
jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enrich original article images
        run: python scripts/enrich_lcf_images.py
      - name: Commit enriched metadata
        run: |
          if ! git diff --quiet -- lcf/articles.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lcf/articles.json
            git commit -m "data: add original source thumbnails to LCF"
            git push
          fi
