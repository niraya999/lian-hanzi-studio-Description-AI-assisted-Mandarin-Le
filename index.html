<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lian Hanzi Studio</title><style>body{background:#f6f4ee;color:#164e46;font:16px system-ui;margin:24px auto;padding:16px;max-width:720px}section{background:white;padding:18px;border-radius:16px;margin:16px 0}textarea{width:100%;box-sizing:border-box;font-size:20px;min-height:100px}button{border:0;border-radius:8px;padding:10px;background:#164e46;color:white;margin:4px;cursor:pointer}.word{background:transparent;color:#164e46;font-size:27px;padding:4px;margin:0}#reader{white-space:pre-wrap;line-height:2;font-size:26px}#hanzi{font-size:36px}</style><h1>Lian Hanzi Studio</h1><p>蓮漢字 · Interactive Reader v0.1</p><section><textarea id="src">我喜歡學習中文。希望每一天都有新的意義。</textarea><button id="read">Baca teks</button><button id="all">🔊 Baca semua</button><input type="file" id="file" accept=".txt,text/plain"></section><section id="reader"></section><section><div id="hanzi">選詞</div><p id="py"></p><p id="meaning">Sentuh kata untuk melihat arti.</p><button id="audio">🔊 Pengucapan</button><p id="status"></p></section><small>Kamus contoh terbatas. Teks diproses di perangkat.</small><script>const $=id=>document.getElementById(id),d=new Map();for(const [a,b,p,m] of [['喜歡','喜欢','xǐhuan','menyukai'],['學習','学习','xuéxí','belajar'],['中文','中文','zhōngwén','bahasa Mandarin'],['希望','希望','xīwàng','berharap'],['一天','一天','yì tiān','satu hari'],['意義','意义','yìyì','makna'],['生命','生命','shēngmìng','kehidupan'],['夢想','梦想','mèngxiǎng','impian'],['漫長','漫长','màncháng','panjang'],['溫柔','温柔','wēnróu','lembut'],['陪伴','陪伴','péibàn','menemani'],['我','我','wǒ','saya'],['每','每','měi','setiap'],['都','都','dōu','semua'],['有','有','yǒu','ada'],['新','新','xīn','baru'],['的','的','de','partikel atribut']]){d.set(a,[p,m]);d.set(b,[p,m])}let selected='';function render(){let s=$('src').value,r=$('reader');r.replaceChildren();selected='';$('hanzi').textContent='選詞';$('py').textContent='';$('meaning').textContent='Sentuh kata untuk melihat arti.';while(s){let c=Array.from(s)[0],w=d.has(s.slice(0,2))?s.slice(0,2):c;s=s.slice(w.length);if(!/\p{Script=Han}/u.test(c)){r.append(c);continue}let b=document.createElement('button');b.className='word';b.textContent=w;b.onclick=()=>{selected=w;$('hanzi').textContent=w;$('py').textContent=d.get(w)?.[0]||'Pinyin belum tersedia';$('meaning').textContent=d.get(w)?.[1]||'Belum ada dalam kamus contoh.'};r.append(b)}}function speak(s){if(!s)return;if(!window.speechSynthesis){$('status').textContent='TTS tidak tersedia';return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='zh-CN';u.rate=.8;u.onerror=()=>{$('status').textContent='Periksa pengaturan audio Mandarin'};speechSynthesis.speak(u)}$('read').onclick=render;$('all').onclick=()=>speak($('src').value);$('audio').onclick=()=>speak(selected);$('file').onchange=async e=>{if(e.target.files[0]){$('src').value=await e.target.files[0].text();render()}};render()</script></html>
