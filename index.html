<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lian Hanzi Studio</title><style>body{background:#f6f4ee;color:#164e46;font:16px system-ui;margin:24px auto;padding:16px;max-width:720px}section{background:white;padding:18px;border-radius:16px;margin:16px 0}textarea{width:100%;box-sizing:border-box;font-size:20px;min-height:100px}button{border:0;border-radius:8px;padding:10px;background:#164e46;color:white;margin:4px;cursor:pointer}.word{background:transparent;color:#164e46;font-size:27px;padding:4px;margin:0}#reader{white-space:pre-wrap;line-height:2;font-size:26px}#hanzi{font-size:36px}</style><h1>Lian Hanzi Studio</h1><p>蓮漢字 · Lyrics Monitoring v0.2</p><section><h2>Music Library</h2><button id="connect">Hubungkan Google Drive</button><button id="refresh">Refresh</button><button id="disconnect">Putuskan koneksi</button><p id="driveStatus" role="status">Belum terhubung</p><div id="albums"></div><div id="tracks"></div></section><section><textarea id="src">我喜歡學習中文。希望每一天都有新的意義。</textarea><button id="read">Baca teks</button><button id="all">🔊 Baca semua</button><input type="file" id="file" accept=".txt,text/plain"></section><section id="reader"></section><section><div id="hanzi">選詞</div><p id="py"></p><p id="meaning">Sentuh kata untuk melihat arti.</p><button id="audio">🔊 Pengucapan</button><p id="status"></p></section><small>Kamus contoh terbatas. Teks diproses di perangkat.</small><script>const $=id=>document.getElementById(id),d=new Map();for(const [a,b,p,m] of [['喜歡','喜欢','xǐhuan','menyukai'],['學習','学习','xuéxí','belajar'],['中文','中文','zhōngwén','bahasa Mandarin'],['希望','希望','xīwàng','berharap'],['一天','一天','yì tiān','satu hari'],['意義','意义','yìyì','makna'],['生命','生命','shēngmìng','kehidupan'],['夢想','梦想','mèngxiǎng','impian'],['漫長','漫长','màncháng','panjang'],['溫柔','温柔','wēnróu','lembut'],['陪伴','陪伴','péibàn','menemani'],['我','我','wǒ','saya'],['每','每','měi','setiap'],['都','都','dōu','semua'],['有','有','yǒu','ada'],['新','新','xīn','baru'],['的','的','de','partikel atribut']]){d.set(a,[p,m]);d.set(b,[p,m])}let selected='';function render(){let s=$('src').value,r=$('reader');r.replaceChildren();selected='';$('hanzi').textContent='選詞';$('py').textContent='';$('meaning').textContent='Sentuh kata untuk melihat arti.';while(s){let c=Array.from(s)[0],w=d.has(s.slice(0,2))?s.slice(0,2):c;s=s.slice(w.length);if(!/\p{Script=Han}/u.test(c)){r.append(c);continue}let b=document.createElement('button');b.className='word';b.textContent=w;b.onclick=()=>{selected=w;$('hanzi').textContent=w;$('py').textContent=d.get(w)?.[0]||'Pinyin belum tersedia';$('meaning').textContent=d.get(w)?.[1]||'Belum ada dalam kamus contoh.'};r.append(b)}}function speak(s){if(!s)return;if(!window.speechSynthesis){$('status').textContent='TTS tidak tersedia';return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='zh-CN';u.rate=.8;u.onerror=()=>{$('status').textContent='Periksa pengaturan audio Mandarin'};speechSynthesis.speak(u)}$('read').onclick=render;$('all').onclick=()=>speak($('src').value);$('audio').onclick=()=>speak(selected);$('file').onchange=async e=>{if(e.target.files[0]){$('src').value=await e.target.files[0].text();render()}};render()</script><script src="https://accounts.google.com/gsi/client" async defer></script><script>
(()=>{const el=id=>document.getElementById(id),root='16_EzGLQ5Jrea56Ru_RrO6EsF46GCUYWs';let token='',client=null,epoch=0;const status=s=>el('driveStatus').textContent=s;const clear=()=>{el('albums').replaceChildren();el('tracks').replaceChildren()};async function api(path,params={}){const t=token;if(!t)throw Error('Hubungkan Google Drive dahulu.');const res=await fetch('https://www.googleapis.com/drive/v3/'+path+'?'+new URLSearchParams(params),{headers:{Authorization:'Bearer '+t}});if(res.status===401){if(token===t){token='';clear()}throw Error('Sesi berakhir. Hubungkan kembali.')}if(!res.ok)throw Error('Google Drive: '+res.status);return res}async function list(id){let out=[],page='';do{const p={q:"'"+id+"' in parents and trashed = false",fields:'nextPageToken,files(id,name,mimeType,modifiedTime)',pageSize:'100',orderBy:'name',supportsAllDrives:'true',includeItemsFromAllDrives:'true'};if(page)p.pageToken=page;const data=await(await api('files',p)).json();out.push(...data.files||[]);page=data.nextPageToken||''}while(page);return out}const folder='application/vnd.google-apps.folder';function button(parent,label,fn){const b=document.createElement('button');b.textContent=label;b.onclick=()=>run(fn);el(parent).append(b)}async function run(fn){try{await fn()}catch(e){status(e.message)}}async function albums(){const n=++epoch;clear();status('Memuat album…');const a=await list(root);if(n!==epoch||!token)return;const valid=a.filter(f=>f.mimeType===folder&&!['Singer','Production Templates'].includes(f.name));for(const f of valid)button('albums',f.name,()=>tracks(f.id,f.name));status(valid.length+' folder album ditemukan.')}async function tracks(id,name){const n=++epoch;el('tracks').replaceChildren();status('Memuat '+name+'…');const a=await list(id);if(n!==epoch||!token)return;const h=document.createElement('h3');h.textContent=name;el('tracks').append(h);for(const f of a){if(f.mimeType===folder)button('tracks','📁 '+f.name,()=>tracks(f.id,f.name));else if(f.mimeType==='application/vnd.google-apps.document'||f.mimeType.startsWith('text/')||/\.txt$/i.test(f.name))button('tracks',f.name,()=>open(f));}status('Isi folder dimuat; pilih dokumen teks atau subfolder.')}async function open(f){const n=++epoch;status('Membaca '+f.name+'…');const res=f.mimeType==='application/vnd.google-apps.document'?await api('files/'+encodeURIComponent(f.id)+'/export',{mimeType:'text/plain'}):await api('files/'+encodeURIComponent(f.id),{alt:'media',supportsAllDrives:'true'});const text=await res.text();if(n!==epoch||!token)return;el('src').value=text;el('read').click();status(f.name+' · dokumen asli tidak diubah.')}el('connect').onclick=()=>run(async()=>{if(!window.google?.accounts?.oauth2)throw Error('Google Identity belum tersedia. Muat ulang halaman di Chrome.');client=google.accounts.oauth2.initTokenClient({client_id:'405638478714-hikhdrp7r0ebg35an8asc41guqc014ep.apps.googleusercontent.com',scope:'https://www.googleapis.com/auth/drive.readonly',include_granted_scopes:false,callback:r=>{if(r.error){status(r.error);return}token=r.access_token;run(albums)},error_callback:e=>status('Login gagal: '+e.type)});client.requestAccessToken({prompt:'select_account'})});el('refresh').onclick=()=>run(albums);el('disconnect').onclick=()=>{++epoch;const t=token;token='';clear();el('src').value='';el('read').click();status('Koneksi diputus.');if(t&&window.google)google.accounts.oauth2.revoke(t,()=>{})};})();
